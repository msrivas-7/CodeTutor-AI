name: E2E shard benchmark

# One-time Release 1D experiment. It concluded on commit c6aa5f0: six shards
# were fastest (316s) versus eight (340s) and four (495s), all reliable. The
# label was removed after measurement. Add the `ci-shard-benchmark` label only
# after the normal E2E run for the same commit is complete; that four-shard
# run becomes the baseline. This workflow then runs the identical exhaustive
# Chromium suite at six and eight shards with the same two workers and no
# retries. The alternative topologies run sequentially so their combined load
# cannot overwhelm the shared Supabase project. Removing the label prevents
# accidental repeated spend.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: e2e-shard-benchmark-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read
  pull-requests: read

jobs:
  benchmark-six:
    if: github.event.label.name == 'ci-shard-benchmark'
    name: Playwright benchmark 6 shards (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BYOK_ENCRYPTION_KEY: ${{ secrets.BYOK_ENCRYPTION_KEY }}
      METRICS_TOKEN: e2e-test-metrics-token
      E2E_USER_SUFFIX: benchmark-6-${{ matrix.shard }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
      MAX_SESSIONS_PER_USER: "60"
      MAX_SESSIONS_GLOBAL: "240"
      DOCKER_EXEC_CONCURRENCY: "16"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Boot docker-compose stack
        run: docker compose up -d backend frontend
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run identical full suite without retries
        working-directory: e2e
        run: npx playwright test --shard=${{ matrix.shard }}/6 --retries=0
      - name: Dump docker-compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shard-benchmark-6-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 30
          if-no-files-found: ignore
      - name: Tear down docker-compose
        if: always()
        run: docker compose down -v

  benchmark-eight:
    if: github.event.label.name == 'ci-shard-benchmark'
    needs: benchmark-six
    name: Playwright benchmark 8 shards (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BYOK_ENCRYPTION_KEY: ${{ secrets.BYOK_ENCRYPTION_KEY }}
      METRICS_TOKEN: e2e-test-metrics-token
      E2E_USER_SUFFIX: benchmark-8-${{ matrix.shard }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
      MAX_SESSIONS_PER_USER: "60"
      MAX_SESSIONS_GLOBAL: "240"
      DOCKER_EXEC_CONCURRENCY: "16"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Boot docker-compose stack
        run: docker compose up -d backend frontend
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run identical full suite without retries
        working-directory: e2e
        run: npx playwright test --shard=${{ matrix.shard }}/8 --retries=0
      - name: Dump docker-compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shard-benchmark-8-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 30
          if-no-files-found: ignore
      - name: Tear down docker-compose
        if: always()
        run: docker compose down -v

  compare:
    name: Compare 4 vs 6 vs 8 shards
    if: always() && github.event.label.name == 'ci-shard-benchmark'
    needs: [benchmark-six, benchmark-eight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Collect same-commit benchmark data
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p e2e/shard-benchmark
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > e2e/shard-benchmark/benchmark-run.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --slurp \
            | node -e 'let d=""; process.stdin.on("data",c=>d+=c).on("end",()=>{const pages=JSON.parse(d); process.stdout.write(JSON.stringify({jobs:pages.flatMap(page=>page.jobs||[])},null,2)+"\n")})' \
            > e2e/shard-benchmark/benchmark-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2e.yml/runs?head_sha=$HEAD_SHA&event=pull_request&status=completed&per_page=20" \
            --jq '.workflow_runs | map(select(.conclusion == "success")) | first' \
            > e2e/shard-benchmark/baseline-run.json
          baseline_id=$(node -e 'const d=require("./e2e/shard-benchmark/baseline-run.json"); if(!d?.id) process.exit(1); process.stdout.write(String(d.id))')
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$baseline_id/jobs?per_page=100" --slurp \
            | node -e 'let d=""; process.stdin.on("data",c=>d+=c).on("end",()=>{const pages=JSON.parse(d); process.stdout.write(JSON.stringify({jobs:pages.flatMap(page=>page.jobs||[])},null,2)+"\n")})' \
            > e2e/shard-benchmark/baseline-jobs.json
      - name: Select the fastest reliable topology
        run: |
          node .github/scripts/e2e-shard-benchmark.mjs \
            --baseline-run e2e/shard-benchmark/baseline-run.json \
            --baseline-jobs e2e/shard-benchmark/baseline-jobs.json \
            --benchmark-run e2e/shard-benchmark/benchmark-run.json \
            --benchmark-jobs e2e/shard-benchmark/benchmark-jobs.json \
            --output e2e/shard-benchmark/result.json
          cat e2e/shard-benchmark/result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-shard-benchmark-result
          path: e2e/shard-benchmark
          retention-days: 90
          if-no-files-found: error
