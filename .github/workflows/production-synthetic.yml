name: Production critical-journey synthetic

on:
  schedule:
    # Four runs per day: enough to catch a broken public funnel without
    # turning the anonymous runner into a material source of spend.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      incident_drill:
        description: 'Deliberately fail before the journey to verify incident automation'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: production-critical-journey-synthetic
  cancel-in-progress: true

jobs:
  synthetic:
    name: Marketing → trial → first output
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_ORIGIN: https://codetutor.msrivas.com
      API_ORIGIN: https://codetutor-ai-vm.eastus2.cloudapp.azure.com
    steps:
      - name: Exercise incident automation
        if: github.event_name == 'workflow_dispatch' && inputs.incident_drill
        run: |
          echo '::error::Controlled incident drill requested by a repository operator.'
          exit 1

      - name: Check public entry points and backend readiness
        run: |
          set -euo pipefail
          synthetic_dir="$(mktemp -d)"

          curl --fail --silent --show-error --max-time 15 \
            "$SITE_ORIGIN/" > "$synthetic_dir/home.html"
          grep -q '<div id="root"></div>' "$synthetic_dir/home.html"

          curl --fail --silent --show-error --max-time 15 \
            "$SITE_ORIGIN/try/lesson/python-fundamentals/hello-world" \
            > "$synthetic_dir/trial.html"
          grep -q '<div id="root"></div>' "$synthetic_dir/trial.html"

          curl --fail --silent --show-error --max-time 15 \
            "$API_ORIGIN/api/health" > "$synthetic_dir/health.json"
          node -e 'const b=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(b.ok!==true) process.exit(1)' \
            "$synthetic_dir/health.json"

      - name: Run the anonymous first program
        run: |
          set -euo pipefail
          synthetic_dir="$(mktemp -d)"

          total_seconds="$(curl --fail --silent --show-error --max-time 35 \
            --output "$synthetic_dir/run.json" \
            --write-out '%{time_total}' \
            --header 'content-type: application/json' \
            --data '{"language":"python","files":[{"path":"main.py","content":"print(\"Hello, Synthetic!\")\n"}]}' \
            "$API_ORIGIN/api/anon/run")"

          node -e 'const b=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(b.stdout!=="Hello, Synthetic!\n"||b.exitCode!==0) process.exit(1)' \
            "$synthetic_dir/run.json"
          # ${seconds} below is a JavaScript template literal, not a shell expansion.
          # shellcheck disable=SC2016
          node -e 'const seconds=Number(process.argv[1]); if(!Number.isFinite(seconds)||seconds>30) { console.error(`Anonymous run took ${seconds}s; budget is 30s`); process.exit(1) }' \
            "$total_seconds"
          echo "Anonymous first output completed in ${total_seconds}s"

      - name: Open an actionable incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT_DRILL: ${{ inputs.incident_drill || false }}
        run: |
          set -euo pipefail
          title='Production synthetic: critical journey is failing'
          if [ "$INCIDENT_DRILL" = 'true' ]; then
            title='Production synthetic incident drill: issue automation verification'
          fi
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            summary='The scheduled Marketing → anonymous trial → first output synthetic failed.'
            if [ "$INCIDENT_DRILL" = 'true' ]; then
              summary='A repository operator deliberately failed the production synthetic to verify incident automation. Production was not reported unhealthy by this drill.'
            fi
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$summary Owner: repository operator. Inspect the failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
