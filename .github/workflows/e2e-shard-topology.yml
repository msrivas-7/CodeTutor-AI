name: E2E shard topology

# Reusable implementation for one exhaustive Chromium shard topology. The
# benchmark caller runs these topologies sequentially so they exercise the same
# commit and shared Supabase project without contending with one another.
on:
  workflow_call:
    inputs:
      total:
        description: Total number of Playwright shards in this topology
        required: true
        type: number
      shards:
        description: JSON array containing every one-based shard index
        required: true
        type: string
      max_parallel:
        description: Maximum shard jobs allowed to execute simultaneously
        required: true
        type: number
      experiment:
        description: Stable experiment identifier used in job names and evidence
        required: false
        default: ''
        type: string
      workers:
        description: Playwright workers per shard
        required: false
        default: 2
        type: number
      backend_image_ref:
        description: Optional immutable backend image reference
        required: false
        default: ''
        type: string
      runner_image_ref:
        description: Optional immutable runner image reference
        required: false
        default: ''
        type: string
      frontend_image_ref:
        description: Optional immutable frontend image reference
        required: false
        default: ''
        type: string
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_ANON_KEY:
        required: true
      SUPABASE_SERVICE_ROLE_KEY:
        required: true
      VITE_SUPABASE_URL:
        required: true
      VITE_SUPABASE_ANON_KEY:
        required: true
      DATABASE_URL:
        required: true
      BYOK_ENCRYPTION_KEY:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  benchmark:
    name: ${{ inputs.experiment != '' && format('Playwright runtime {0} ({1}/{2})', inputs.experiment, matrix.shard, inputs.total) || format('Playwright benchmark {0} shards ({1}/{0})', inputs.total, matrix.shard) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BYOK_ENCRYPTION_KEY: ${{ secrets.BYOK_ENCRYPTION_KEY }}
      METRICS_TOKEN: e2e-test-metrics-token
      E2E_USER_SUFFIX: benchmark-${{ inputs.experiment || inputs.total }}-${{ matrix.shard }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
      MAX_SESSIONS_PER_USER: "60"
      MAX_SESSIONS_GLOBAL: "240"
      DOCKER_EXEC_CONCURRENCY: "16"
      BACKEND_IMAGE: ${{ inputs.backend_image_ref }}
      RUNNER_IMAGE: ${{ inputs.runner_image_ref }}
      FRONTEND_IMAGE: ${{ inputs.frontend_image_ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GHCR for immutable benchmark images
        if: inputs.backend_image_ref != '' && inputs.runner_image_ref != '' && inputs.frontend_image_ref != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Allocate isolated anonymous client identity
        run: echo "E2E_FORWARDED_FOR=$(node .github/scripts/e2e-forwarded-ip.mjs "$E2E_USER_SUFFIX")" >> "$GITHUB_ENV"
      - name: Boot docker-compose stack
        run: |
          set -euo pipefail
          if [ -n "$BACKEND_IMAGE" ] && [ -n "$RUNNER_IMAGE" ] && [ -n "$FRONTEND_IMAGE" ]; then
            .github/scripts/pull-container-images.sh "$BACKEND_IMAGE" "$RUNNER_IMAGE" "$FRONTEND_IMAGE"
            docker compose up -d --no-build backend frontend
          else
            docker compose up -d backend frontend
          fi
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run identical full suite without retries
        working-directory: e2e
        run: npx playwright test --shard=${{ matrix.shard }}/${{ inputs.total }} --workers=${{ inputs.workers }} --retries=0
      - name: Dump docker-compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shard-benchmark-${{ inputs.total }}-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 30
          if-no-files-found: ignore
      - name: Tear down docker-compose
        if: always()
        run: docker compose down -v
