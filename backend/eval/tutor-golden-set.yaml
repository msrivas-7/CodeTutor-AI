# Phase A — Tutor-quality golden set v1
#
# 30 hand-authored prompts covering the 5 tutor intents (debug / concept /
# howto / walkthrough / checkin) across Python and JavaScript. Each prompt
# carries a 3-dimension Y/N rubric:
#   - hallucinationY: tutor invented NO API not in stdlib or user file
#   - socraticY: tutor asks at least one diagnostic question and does NOT
#     paste a complete fixed code block (per coreRules.ts)
#   - groundedY: tutor cites at least one file:line reference
#
# When the eval runner invokes this set, each prompt's tutor response is
# graded by the pinned independent judge on each rubric dimension. Aggregate
# pass-rate is the AND across the three dimensions.
#
# Prompt IDs use g###. Intent distribution: 6 each × 5 intents.
# Language distribution: ~half Python, ~half JS.
#
# Add new prompts at the end. Don't reorder — IDs are stable references.

